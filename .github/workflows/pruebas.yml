# Corre las pruebas del backend en cada push y en cada pull request.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: splitter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            splitter/requirements.txt
            splitter/requirements-dev.txt

      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Revisión de código (ruff)
        run: ruff check app migraciones scripts tests e2e --select F,E9

      - name: Pruebas
        run: pytest -q

  navegador:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: splitter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            splitter/requirements.txt
            splitter/requirements-dev.txt

      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Dependencias y navegador
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Pruebas en navegador (registro, separación, dos pasos)
        run: pytest e2e -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintaxis de los scripts
        run: for f in splitter/frontend/*.js; do node --check "$f" || exit 1; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La imagen se construye
        run: docker build splitter
