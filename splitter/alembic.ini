# Migraciones de la base. La dirección de la base sale de DATABASE_URL (.env).
# Normalmente no hace falta correrlas a mano: la app las aplica al arrancar.
#   .venv/bin/alembic upgrade head        aplica las que falten
#   .venv/bin/alembic revision -m "..."   crea una nueva en migraciones/versions
[alembic]
script_location = migraciones
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
